<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirma tu asistencia</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background">

<div class="card">

    <!--<h1>Confirma tu asistencia</h1>

     <h2>Ana Sofia</h2>

   <p class="mensaje">

        Tu presencia hará este día aún más especial.

        <br>

        Por favor confirma tu asistencia.

    </p>-->

    <form id="formulario">

        <div class="campo">

            <label for="nombre">

                Nombre

            </label>

            <input
                type="text"
                id="nombre"
                maxlength="40"
                placeholder="Escribe tu nombre">

        </div>

        <div class="campo">

            <label for="apellidos">

                Apellidos

            </label>

            <input
                type="text"
                id="apellidos"
                maxlength="60"
                placeholder="Escribe tus apellidos">

        </div>

        <div class="campo">

            <label>

                ¿Asistirás?

            </label>

            <select id="asistencia">

                <option value="">

                    Selecciona una opción

                </option>

                <option value="Sí asistiré">

                    Sí asistiré

                </option>

                <option value="No podré asistir">

                    No podré asistir

                </option>

            </select>

        </div>
        <button
            type="button"
            id="btnEnviar"
            onclick="enviarFormulario()">

            <i class="fa-brands fa-whatsapp"></i>

            Confirmar por WhatsApp

        </button>

    </form>

</div>

</div>

<script src="script.js"></script>

</body>
